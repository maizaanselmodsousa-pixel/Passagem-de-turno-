<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passagem de Turno — INP/PS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:13px;}
header{background:linear-gradient(90deg,#ffe600,#ffcc00);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.header-left{display:flex;align-items:center;gap:12px;}
.logo{font-size:22px;font-weight:900;background:#1a1a2e;color:#ffe600;padding:4px 10px;border-radius:6px;}
header h1{font-size:15px;font-weight:800;}
header small{font-size:11px;color:#555;}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{border:none;border-radius:8px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.btn-dark{background:#1a1a2e;color:white;}
.btn-dark:hover{background:#2d2d4e;}
.btn-green{background:#10b981;color:white;}
.btn-green:hover{background:#059669;}
.btn-red{background:#ef4444;color:white;}
.btn-red:hover{background:#dc2626;}
.btn-outline{background:white;color:#1a1a2e;border:1.5px solid #ddd;}
.btn-outline:hover{background:#f5f5f5;}
a.btn{text-decoration:none;display:inline-block;}
#sync-bar{display:none;position:fixed;top:0;left:0;right:0;background:#ffe600;color:#1a1a2e;text-align:center;font-size:12px;font-weight:700;padding:5px;z-index:9999;}
.kpi-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px 0;}
.kpi-card{background:white;border-radius:10px;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.07);border-top:4px solid #e0e0e0;display:flex;flex-direction:column;gap:4px;}
.kpi-card.blue{border-top-color:#3b82f6;}
.kpi-card.green{border-top-color:#10b981;}
.kpi-card.amber{border-top-color:#f59e0b;}
.kpi-card.red{border-top-color:#ef4444;}
.kpi-label{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.5px;}
.kpi-value{font-size:26px;font-weight:900;color:#1a1a2e;line-height:1;}
.kpi-sub{font-size:10px;color:#aaa;}
.tabs{display:flex;gap:4px;padding:14px 16px 0;flex-wrap:wrap;}
.tab{padding:7px 18px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;border:1.5px solid #ddd;border-bottom:none;background:#e8e9eb;cursor:pointer;color:#888;font-family:inherit;transition:all 0.15s;}
.tab.active{background:white;color:#1a1a2e;border-color:#ccc;}
.tab.t1.active{background:#3b82f6;color:white;border-color:#3b82f6;}
.tab.t2.active{background:#10b981;color:white;border-color:#10b981;}
.tab.t3.active{background:#f59e0b;color:white;border-color:#f59e0b;}
.tab.tab-resumo.active{background:#1a1a2e;color:#ffe600;border-color:#1a1a2e;}
.content{background:white;margin:0 16px 16px;border-radius:0 10px 10px 10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.07);}
.panel{display:none;}
.panel.active{display:block;}
.section-title{font-size:11px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.top-row{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;margin-bottom:14px;}
.meta-box{display:flex;flex-direction:column;gap:6px;}
.meta-box label{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;}
.meta-box input[type=date],.meta-box select{border:1.5px solid #e0e0e0;border-radius:7px;padding:5px 10px;font-size:12px;font-family:inherit;outline:none;background:#fafafa;transition:border 0.2s;}
.meta-box input[type=date]:focus,.meta-box select:focus{border-color:#3b82f6;}
.hc-box{background:#f8f9fa;border-radius:10px;padding:10px 12px;border:1.5px solid #efefef;}
.hc-box h4{font-size:10px;font-weight:800;color:#555;text-transform:uppercase;margin-bottom:8px;}
.hc-inline{display:flex;flex-wrap:wrap;gap:8px;}
.hc-field{display:flex;flex-direction:column;gap:3px;min-width:56px;}
.hc-field label{font-size:9px;color:#aaa;font-weight:700;text-transform:uppercase;}
.hc-field input{border:1.5px solid #e0e0e0;border-radius:6px;padding:4px 6px;font-size:13px;font-weight:700;font-family:inherit;outline:none;background:white;width:56px;text-align:center;transition:border 0.2s;}
.hc-field input:focus{border-color:#3b82f6;}
.metrics-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;}
.metric{background:#f8f9fa;border-radius:8px;padding:8px 10px;border-left:4px solid #e0e0e0;display:flex;flex-direction:column;gap:3px;transition:box-shadow 0.2s;cursor:pointer;}
.metric:hover{box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.metric.blue{border-left-color:#3b82f6;} .metric.green{border-left-color:#10b981;}
.metric.amber{border-left-color:#f59e0b;} .metric.red{border-left-color:#ef4444;}
.metric.purple{border-left-color:#8b5cf6;} .metric.gray{border-left-color:#9ca3af;}
.metric label{font-size:9px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.3px;}
.metric input{font-size:22px;font-weight:900;color:#1a1a2e;border:none;outline:none;background:transparent;font-family:inherit;width:100%;padding:0;}
.metric input:focus{color:#3b82f6;}
.bottom-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.bottom-box{background:#f8f9fa;border-radius:10px;padding:10px 12px;border:1.5px solid #efefef;}
.bottom-box h4{font-size:10px;font-weight:800;color:#555;text-transform:uppercase;margin-bottom:8px;}
.bottom-field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;}
.bottom-field label{font-size:9px;font-weight:700;color:#aaa;text-transform:uppercase;}
.bottom-field input,.bottom-field select,.bottom-field textarea{border:1.5px solid #e0e0e0;border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit;outline:none;background:white;transition:border 0.2s;}
.bottom-field input:focus,.bottom-field select:focus,.bottom-field textarea:focus{border-color:#3b82f6;}
.alert-input{width:100%;border:1.5px solid #fed7aa;border-radius:7px;padding:7px 9px;font-size:12px;font-family:inherit;outline:none;background:#fff7ed;color:#92400e;font-weight:600;resize:none;min-height:60px;transition:border 0.2s;}
.alert-input:focus{border-color:#f59e0b;}
textarea.obs-input{width:100%;resize:none;min-height:80px;border:1.5px solid #e0e0e0;border-radius:7px;padding:7px 9px;font-size:12px;font-family:inherit;outline:none;background:white;transition:border 0.2s;}
textarea.obs-input:focus{border-color:#3b82f6;}
.save-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #f0f0f0;flex-wrap:wrap;gap:8px;}
.save
