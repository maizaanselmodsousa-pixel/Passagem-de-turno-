<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passagem de Turno — INP/PS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f1f3; color: #1a1a2e; font-size: 12px; }
header { background: linear-gradient(90deg, #ffe600, #ffcc00); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
.header-left { display: flex; align-items: center; gap: 10px; }
.logo { font-size: 18px; font-weight: 900; }
header h1 { font-size: 14px; font-weight: 800; }
header small { font-size: 10px; color: #666; }
.btn-sheets { background: #1a1a2e; color: white; border: none; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
.tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
.tab { padding: 5px 16px; border-radius: 7px 7px 0 0; font-size: 11px; font-weight: 700; border: 1.5px solid #ddd; border-bottom: none; background: #e8e9eb; cursor: pointer; color: #888; }
.tab.active { background: white; color: #1a1a2e; border-color: #ccc; }
.tab.t1.active { background: #3b82f6; color: white; border-color: #3b82f6; }
.tab.t2.active { background: #10b981; color: white; border-color: #10b981; }
.tab.t3.active { background: #f59e0b; color: white; border-color: #f59e0b; }
.tab-resumo.active { background: #1a1a2e; color: #ffe600; border-color: #1a1a2e; }
.content { background: white; margin: 0 12px 12px; border-radius: 0 8px 8px 8px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.panel { display: none; }
.panel.active { display: block; }
.top-row { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px; margin-bottom: 10px; align-items: start; }
.meta-box { display: flex; flex-direction: column; gap: 5px; }
.meta-box label { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; }
.meta-box input[type=date], .meta-box select { border: 1.5px solid #e0e0e0; border-radius: 6px; padding: 4px 8px; font-size: 11px; font-family: inherit; outline: none; background: #fafafa; }
.hc-box { background: #f8f9fa; border-radius: 8px; padding: 8px 10px; }
.hc-box h4 { font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; margin-bottom: 6px; }
.hc-inline { display: flex; flex-wrap: wrap; gap: 6px; }
.hc-field { display: flex; flex-direction: column; gap: 2px; min-width: 52px; }
.hc-field label { font-size: 9px; color: #aaa; font-weight: 700; text-transform: uppercase; }
.hc-field input { border: 1px solid #e0e0e0; border-radius: 5px; padding: 3px 5px; font-size: 12px; font-weight: 700; font-family: inherit; outline: none; background: white; width: 52px; text-align: center; }
.metrics-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
.metric { background: #f8f9fa; border-radius: 7px; padding: 7px 8px; border-left: 3px solid #e0e0e0; display: flex; flex-direction: column; gap: 2px; }
.metric.blue { border-left-color: #3b82f6; }
.metric.green { border-left-color: #10b981; }
.metric.amber { border-left-color: #f59e0b; }
.metric.red { border-left-color: #ef4444; }
.metric.purple { border-left-color: #8b5cf6; }
.metric.gray { border-left-color: #9ca3af; }
.metric label { font-size: 9px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.3px; }
.metric input { font-size: 20px; font-weight: 900; color: #1a1a2e; border: none; outline: none; background: transparent; font-family: inherit; width: 100%; padding: 0; }
.bottom-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.bottom-box { background: #f8f9fa; border-radius: 7px; padding: 8px 10px; }
.bottom-box h4 { font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; margin-bottom: 6px; }
.bottom-field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
.bottom-field label { font-size: 9px; font-weight: 700; color: #aaa; text-transform: uppercase; }
.bottom-field input, .bottom-field select, .bottom-field textarea { border: 1px solid #e0e0e0; border-radius: 5px; padding: 4px 6px; font-size: 11px; font-family: inherit; outline: none; background: white; }
.alert-input { width: 100%; border: 1px solid #fed7aa; border-radius: 5px; padding: 5px 7px; font-size: 11px; font-family: inherit; outline: none; background: #fff7ed; color: #92400e; font-weight: 600; resize: none; min-height: 40px; }
.save-row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 8px; }
.save-status { font-size: 11px; color: #10b981; font-weight: 700; opacity: 0; transition: opacity 0.3s; }
.save-status.show { opacity: 1; }
.btn-clear { background: #f0f0f0; color: #666; border: none; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
.btn-open { background: #1a1a2e; color: white; border: none; border-radius: 6px; padding: 5px 14px; font-size: 11px; font-weight: 700; cursor: pointer; text-decoration: none; }
.resumo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.resumo-card { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; }
.resumo-turno { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
.t1 .resumo-turno { background: #dbeafe; color: #1e40af; }
.t2 .resumo-turno { background: #d1fae5; color: #065f46; }
.t3 .resumo-turno { background: #fef3c7; color: #92400e; }
.resumo-row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #ececec; }
.resumo-row:last-child { border: none; }
.rk { color: #999; }
.rv { font-weight: 700; }
.resumo-empty { font-size: 11px; color: #ccc; font-style: italic; text-align: center; padding: 20px 0; }
footer { text-align: center; padding: 8px; font-size: 10px; color: #ccc; }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <span class="logo">ML</span>
    <div>
      <h1>Passagem de Turno — INP / PS</h1>
      <small id="header-date"></small>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn-sheets" onclick="syncSheet()" id="btn-sync">🔄 Sincronizar</button>
    <a class="btn-sheets" href="https://docs.google.com/spreadsheets/d/1F09r4otAryw8CQ-sjIbaD0y6cG4Xu__vtKRIuxjBiJc/edit" target="_blank">📊 Planilha</a>
  </div>
  <div id="sync-bar" style="display:none;position:fixed;top:0;left:0;right:0;background:#ffe600;color:#1a1a2e;text-align:center;font-size:12px;font-weight:700;padding:4px;z-index:999;">Buscando dados da planilha...</div>
</header>
<div class="tabs">
  <button class="tab t1 active" onclick="showTab('t1',this)">🔵 T1</button>
  <button class="tab t2" onclick="showTab('t2',this)">🟢 T2</button>
  <button class="tab t3" onclick="showTab('t3',this)">🟡 T3</button>
  <button class="tab tab-resumo" onclick="showTab('resumo',this)" style="margin-left:auto">📋 Resumo</button>
</div>
<div class="content">
  <div id="panel-t1" class="panel active"></div>
  <div id="panel-t2" class="panel"></div>
  <div id="panel-t3" class="panel"></div>
  <div id="panel-resumo" class="panel"><div class="resumo-grid" id="resumo-content"></div></div>
</div>
<footer>MercadoLivre · INP/PS · <span id="footer-date"></span></footer>
<script>
const store = { t1: {}, t2: {}, t3: {} };
function sv(t, k, val) { store[t][k] = val; flash(t); }
function flash(t) { const el = document.getElementById('ss-' + t); if (el) { el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2000); } }
function g(t, k) { return store[t][k] || ''; }
function hcf(t, k, lbl) { return '<div class="hc-field"><label>' + lbl + '</label><input type="number" value="' + g(t,k) + '" placeholder="0" onchange="sv(\'' + t + '\',\'' + k + '\',this.value)"></div>'; }
function met(t, k, lbl, color) { return '<div class="metric ' + color + '"><label>' + lbl + '</label><input type="text" value="' + g(t,k) + '" placeholder="—" onchange="sv(\'' + t + '\',\'' + k + '\',this.value)"></div>'; }
function buildForm(t) {
  var ok = g(t,'cinco_s')==='OK'?'selected':'', pend = g(t,'cinco_s')==='Pendente'?'selected':'', nok = g(t,'cinco_s')==='NOK'?'selected':'';
  return '<div class="top-row"><div class="meta-box"><label>Data</label><input type="date" value="'+g(t,'data')+'" onchange="sv(\''+t+'\',\'data\',this.value)"><label style="margin-top:4px">Turno</label><select onchange="sv(\''+t+'\',\'turno\',this.value)"><option '+(t==='t1'?'selected':'')+'>T1</option><option '+(t==='t2'?'selected':'')+'>T2</option><option '+(t==='t3'?'selected':'')+'>T3</option></select></div><div class="hc-box"><h4>👥 HC INP</h4><div class="hc-inline">'+hcf(t,'hc_inp_p','Pres.')+hcf(t,'hc_inp_f','Folgas')+hcf(t,'hc_inp_fer','Férias')+hcf(t,'hc_inp_sin','Sinergia')+hcf(t,'hc_inp_lic','Licença')+'</div></div><div class="hc-box"><h4>👥 HC PS Produção</h4><div class="hc-inline">'+hcf(t,'hc_ps_p','Pres.')+hcf(t,'hc_ps_tr','Trein.')+hcf(t,'hc_ps_at','Atest.')+hcf(t,'hc_ps_fal','Falta')+hcf(t,'hc_ps_lic','Licença')+'</div></div></div><div class="metrics-grid">'+met(t,'ci_inicio','Check-in Início','blue')+met(t,'ci_backlog','Backlog','gray')+met(t,'ci_fim','Check-in Fim','blue')+met(t,'ci_pecas','Peças Process.','green')+met(t,'ci_ps_fin','PS Finalizadas','green')+met(t,'tarefa6h','Tarefas < 6h','amber')+met(t,'ps_pend_ini','PS Pend. Início','red')+met(t,'ps_ident','PS Identificados','blue')+met(t,'ps_pend_fim','PS Pend. Fim','amber')+met(t,'pa_real','Put Away Real.','green')+met(t,'pa_pend','Put Away Pend.','amber')+met(t,'paletes','Paletes p/Linha','purple')+'</div><div class="bottom-row"><div class="bottom-box"><h4>⚠️ Alertas / Tickets</h4><textarea class="alert-input" placeholder="Ex: SSHP-1234..." onchange="sv(\''+t+'\',\'alertas\',this.value)">'+g(t,'alertas')+'</textarea></div><div class="bottom-box"><h4>📋 Outros</h4><div class="bottom-field"><label>Última ida na linha</label><input type="time" value="'+g(t,'ultima_ida')+'" onchange="sv(\''+t+'\',\'ultima_ida\',this.value)"></div><div class="bottom-field"><label>Reaberturas Pend.</label><input type="number" value="'+g(t,'reaberturas')+'" placeholder="0" onchange="sv(\''+t+'\',\'reaberturas\',this.value)"></div><div class="bottom-field"><label>5S</label><select onchange="sv(\''+t+'\',\'cinco_s\',this.value)"><option value="">—</option><option value="OK" '+ok+'>✅ OK</option><option value="Pendente" '+pend+'>⏳ Pendente</option><option value="NOK" '+nok+'>❌ NOK</option></select></div></div><div class="bottom-box"><h4>📝 Observações</h4><textarea style="width:100%;resize:none;min-height:72px;border:1px solid #e0e0e0;border-radius:5px;padding:5px 7px;font-size:11px;font-family:inherit;outline:none;background:white" placeholder="Pontos de atenção..." onchange="sv(\''+t+'\',\'obs\',this.value)">'+g(t,'obs')+'</textarea></div></div><div class="save-row"><span class="save-status" id="ss-'+t+'">✅ Salvo</span><button class="btn-clear" onclick="clearT(\''+t+'\')">Limpar</button><a class="btn-open" href="https://docs.google.com/spreadsheets/d/1F09r4otAryw8CQ-sjIbaD0y6cG4Xu__vtKRIuxjBiJc/edit" target="_blank">📊 Abrir Planilha</a></div>';
}
function clearT(t) { if (!confirm('Limpar dados?')) return; store[t] = {}; document.getElementById('panel-'+t).innerHTML = buildForm(t); }
function showTab(name, btn) { document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');}); document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');}); btn.classList.add('active'); document.getElementById('panel-'+name).classList.add('active'); if(name==='resumo') renderResumo(); }
function renderResumo() {
  var tl={t1:'T1',t2:'T2',t3:'T3'};
  document.getElementById('resumo-content').innerHTML=['t1','t2','t3'].map(function(t){
    var d=store[t],has=d.data||d.hc_ps_p;
    var rows=[['Data',d.data?d.data.split('-').reverse().join('/'):'—'],['HC INP',d.hc_inp_p||'—'],['HC PS',d.hc_ps_p||'—'],['Check-in Início',d.ci_inicio||'—'],['Check-in Fim',d.ci_fim||'—'],['PS Pend. Início',d.ps_pend_ini||'—'],['PS Identificados',d.ps_ident||'—'],['PS Pend. Fim',d.ps_pend_fim||'—'],['5S',d.cinco_s||'—'],['Alertas',d.alertas?d.alertas.substring(0,35)+(d.alertas.length>35?'…':''):'—']];
    return '<div class="resumo-card '+t+'"><span class="resumo-turno">Turno '+tl[t]+'</span>'+(has?rows.map(function(r){return'<div class="resumo-row"><span class="rk">'+r[0]+'</span><span class="rv">'+r[1]+'</span></div>';}).join(''):'<div class="resumo-empty">Sem dados</div>')+'</div>';
  }).join('');
}
var SHEET_CSV='https://api.allorigins.win/raw?url=' + encodeURIComponent('https://docs.google.com/spreadsheets/d/1F09r4otAryw8CQ-sjIbaD0y6cG4Xu__vtKRIuxjBiJc/pub?output=csv');
function parseCSV(text){var lines=text.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});return lines.map(function(line){var cols=[],cur='',inQ=false;for(var i=0;i<line.length;i++){if(line[i]==='"'){inQ=!inQ;}else if(line[i]===','&&!inQ){cols.push(cur.trim());cur='';}else{cur+=line[i];}}cols.push(cur.trim());return cols;});}
function rowVal(rows,keyword){var r=rows.find(function(r){return r[1]&&r[1].toLowerCase().indexOf(keyword.toLowerCase())!==-1;});return r?(r[2]||'').trim():'';}
function syncSheet(){
  var bar=document.getElementById('sync-bar'),btn=document.getElementById('btn-sync');
  bar.style.display='block';btn.textContent='⏳ Buscando...';
  fetch(SHEET_CSV+'&t='+Date.now()).then(function(res){return res.text();}).then(function(text){
    var rows=parseCSV(text);
    var dataRow=rows.find(function(r){return r[1]&&r[1].toLowerCase().indexOf('data')!==-1;});
    var turnoStr=dataRow?(dataRow[3]||''):'';
    var turno='t2';
    if(turnoStr.indexOf('T1')!==-1||turnoStr.indexOf('t1')!==-1)turno='t1';
    else if(turnoStr.indexOf('T3')!==-1||turnoStr.indexOf('t3')!==-1)turno='t3';
    var dataVal=rowVal(rows,'data');
    if(dataVal){var parts=dataVal.split('/');if(parts.length===3)store[turno].data=parts[2]+'-'+parts[1].padStart(2,'0')+'-'+parts[0].padStart(2,'0');}
    var hcInp=rowVal(rows,'HC INP');if(hcInp)store[turno].hc_inp_p=hcInp;
    var hcInpRow=rows.find(function(r){return r[1]&&r[1].toLowerCase().indexOf('hc inp')!==-1;});
    if(hcInpRow&&hcInpRow[3]){var obs=hcInpRow[3],m;m=obs.match(/folgas?:\s*(\d+)/i);if(m)store[turno].hc_inp_f=m[1];m=obs.match(/f.rias?:\s*(\d+)/i);if(m)store[turno].hc_inp_fer=m[1];m=obs.match(/sinergia:\s*(\d+)/i);if(m)store[turno].hc_inp_sin=m[1];m=obs.match(/licen.a:\s*(\d+)/i);if(m)store[turno].hc_inp_lic=m[1];}
    var hcPs=rowVal(rows,'HC PS');if(hcPs)store[turno].hc_ps_p=hcPs;
    var hcPsRow=rows.find(function(r){return r[1]&&r[1].toLowerCase().indexOf('hc ps')!==-1;});
    if(hcPsRow&&hcPsRow[3]){var obs2=hcPsRow[3],m2;m2=obs2.match(/treinamento:\s*(\d+)/i);if(m2)store[turno].hc_ps_tr=m2[1];m2=obs2.match(/atestado:\s*(\d+)/i);if(m2)store[turno].hc_ps_at=m2[1];m2=obs2.match(/falta:\s*(\d+)/i);if(m2)store[turno].hc_ps_fal=m2[1];m2=obs2.match(/licen.a:\s*(\d+)/i);if(m2)store[turno].hc_ps_lic=m2[1];}
    var fieldMap=[['início do turno','ci_inicio'],['fim do turno','ci_fim'],['peças processadas','ci_pecas'],['ps finalizadas','ci_ps_fin'],['menos de 6','tarefa6h'],['pendentes início','ps_pend_ini'],['identificados','ps_ident'],['pendentes','ps_pend_fim'],['put away  realizado','pa_real'],['put away  pendente','pa_pend'],['paletes','paletes'],['última ida','ultima_ida'],['reaberturas','reaberturas'],['5s','cinco_s']];
    fieldMap.forEach(function(pair){var val=rowVal(rows,pair[0]);if(val)store[turno][pair[1]]=val;});
    var alertRow=rows.find(function(r){return r[1]&&r[1].toLowerCase().indexOf('alertas')!==-1;});
    if(alertRow)store[turno].alertas=[alertRow[2],alertRow[3]].filter(Boolean).join(' — ');
    var ciRow=rows.find(function(r){return r[1]&&r[1].toLowerCase().indexOf('início do turno')!==-1;});
    if(ciRow&&ciRow[3]){var bm=ciRow[3].match(/backlog:\s*(\d+)/i);if(bm)store[turno].ci_backlog=bm[1];}
    document.getElementById('panel-'+turno).innerHTML=buildForm(turno);
    document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
    document.querySelector('.tab.'+turno).classList.add('active');
    document.getElementById('panel-'+turno).classList.add('active');
    bar.style.background='#10b981';bar.style.color='white';bar.textContent='✅ Dados sincronizados!';
    setTimeout(function(){bar.style.display='none';bar.style.background='#ffe600';bar.style.color='#1a1a2e';bar.textContent='Buscando dados da planilha...';},2500);
  }).catch(function(){
    bar.style.background='#ef4444';bar.style.color='white';bar.textContent='❌ Erro ao buscar planilha.';
    setTimeout(function(){bar.style.display='none';bar.style.background='#ffe600';bar.style.color='#1a1a2e';},3000);
  }).finally(function(){btn.textContent='🔄 Sincronizar';});
}
['t1','t2','t3'].forEach(function(t){document.getElementById('panel-'+t).innerHTML=buildForm(t);});
var now=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
document.getElementById('header-date').textContent=now;
document.getElementById('footer-date').textContent=now;
</script>
</body>
</html>
