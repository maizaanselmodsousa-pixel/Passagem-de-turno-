<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passagem de Turno — INP/PS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f1f3; color: #1a1a2e; font-size: 12px; }
header { background: linear-gradient(90deg, #ffe600, #ffcc00); padding: 8px 16px; display: flex; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
.header-left { display: flex; align-items: center; gap: 10px; }
.logo { font-size: 18px; font-weight: 900; }
header h1 { font-size: 14px; font-weight: 800; }
header small { font-size: 10px; color: #666; }
.tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
.tab { padding: 5px 16px; border-radius: 7px 7px 0 0; font-size: 11px; font-weight: 700; border: 1.5px solid #ddd; border-bottom: none; background: #e8e9eb; cursor: pointer; color: #888; }
.tab.active { background: white; color: #1a1a2e; border-color: #ccc; }
.tab.t1.active { background: #3b82f6; color: white; border-color: #3b82f6; }
.tab.t2.active { background: #10b981; color: white; border-color: #10b981; }
.tab.t3.active { background: #f59e0b; color: white; border-color: #f59e0b; }
.tab.tab-resumo.active { background: #1a1a2e; color: #ffe600; border-color: #1a1a2e; }
.content { background: white; margin: 0 12px 12px; border-radius: 0 8px 8px 8px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.panel { display: none; }
.panel.active { display: block; }
.top-row { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px; margin-bottom: 10px; align-items: start; }
.meta-box { display: flex; flex-direction: column; gap: 5px; }
.meta-box label { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; }
.meta-box input[type=date], .meta-box select { border: 1.5px solid #e0e0e0; border-radius: 6px; padding: 4px 8px; font-size: 11px; font-family: inherit; outline: none; background: #fafafa; }
.hc-box { background: #f8f9fa; border-radius: 8px; padding: 8px 10px; }
.hc-box h4 { font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; margin-bottom: 6px; }
.hc-inline { display: flex; flex-wrap: wrap; gap: 6px; }
.hc-field { display: flex; flex-direction: column; gap: 2px; min-width: 52px; }
.hc-field label { font-size: 9px; color: #aaa; font-weight: 700; text-transform: uppercase; }
.hc-field input { border: 1px solid #e0e0e0; border-radius: 5px; padding: 3px 5px; font-size: 12px; font-weight: 700; font-family: inherit; outline: none; background: white; width: 52px; text-align: center; }
.metrics-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
.metric { background: #f8f9fa; border-radius: 7px; padding: 7px 8px; border-left: 3px solid #e0e0e0; display: flex; flex-direction: column; gap: 2px; }
.metric.blue { border-left-color: #3b82f6; } .metric.green { border-left-color: #10b981; }
.metric.amber { border-left-color: #f59e0b; } .metric.red { border-left-color: #ef4444; }
.metric.purple { border-left-color: #8b5cf6; } .metric.gray { border-left-color: #9ca3af; }
.metric label { font-size: 9px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.3px; }
.metric input { font-size: 20px; font-weight: 900; color: #1a1a2e; border: none; outline: none; background: transparent; font-family: inherit; width: 100%; padding: 0; }
.bottom-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.bottom-box { background: #f8f9fa; border-radius: 7px; padding: 8px 10px; }
.bottom-box h4 { font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; margin-bottom: 6px; }
.bottom-field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
.bottom-field label { font-size: 9px; font-weight: 700; color: #aaa; text-transform: uppercase; }
.bottom-field input, .bottom-field select, .bottom-field textarea { border: 1px solid #e0e0e0; border-radius: 5px; padding: 4px 6px; font-size: 11px; font-family: inherit; outline: none; background: white; }
.alert-input { width: 100%; border: 1px solid #fed7aa; border-radius: 5px; padding: 5px 7px; font-size: 11px; font-family: inherit; outline: none; background: #fff7ed; color: #92400e; font-weight: 600; resize: none; min-height: 40px; }
.save-row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 8px; }
.save-status { font-size: 11px; color: #10b981; font-weight: 700; opacity: 0; transition: opacity 0.3s; }
.save-status.show { opacity: 1; }
.btn-clear { background: #f0f0f0; color: #666; border: none; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
.resumo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.resumo-card { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; }
.resumo-turno { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
.t1 .resumo-turno { background: #dbeafe; color: #1e40af; }
.t2 .resumo-turno { background: #d1fae5; color: #065f46; }
.t3 .resumo-turno { background: #fef3c7; color: #92400e; }
.resumo-row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #ececec; }
.resumo-row:last-child { border: none; }
.rk { color: #999; } .rv { font-weight: 700; }
.resumo-empty { font-size: 11px; color: #ccc; font-style: italic; text-align: center; padding: 20px 0; }
footer { text-align: center; padding: 8px; font-size: 10px; color: #ccc; }
/* Lista de Presença */
.presenca-box { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
.presenca-box h4 { font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.presenca-table { width: 100%; border-collapse: collapse; }
.presenca-table th { font-size: 9px; font-weight: 700; color: #aaa; text-transform: uppercase; text-align: left; padding: 3px 6px; border-bottom: 1px solid #e8e8e8; }
.presenca-table td { padding: 3px 6px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
.presenca-table tr:last-child td { border-bottom: none; }
.presenca-nome { font-size: 11px; font-weight: 600; color: #1a1a2e; }
.presenca-select { border: 1px solid #e0e0e0; border-radius: 5px; padding: 2px 6px; font-size: 11px; font-family: inherit; outline: none; background: white; font-weight: 600; }
.presenca-select.presente { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
.presenca-select.falta { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
.presenca-select.atestado { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
.presenca-select.ferias { background: #ede9fe; color: #4c1d95; border-color: #c4b5fd; }
.presenca-select.licenca { background: #e0f2fe; color: #0c4a6e; border-color: #7dd3fc; }
.btn-rm { background: none; border: none; color: #ccc; cursor: pointer; font-size: 13px; padding: 0 2px; line-height: 1; }
.btn-rm:hover { color: #ef4444; }
.presenca-add-row { display: flex; gap: 6px; margin-top: 8px; }
.presenca-add-row input { flex: 1; border: 1px solid #e0e0e0; border-radius: 5px; padding: 4px 8px; font-size: 11px; font-family: inherit; outline: none; }
.btn-add-pessoa { background: #1a1a2e; color: white; border: none; border-radius: 5px; padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.presenca-count { font-size: 10px; font-weight: 700; color: #10b981; background: #d1fae5; border-radius: 10px; padding: 1px 7px; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="logo">ML</span>
    <div>
      <h1>Passagem de Turno — INP / PS</h1>
      <small id="header-date"></small>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab t1 active" onclick="showTab('t1',this)">🔵 T1</button>
  <button class="tab t2" onclick="showTab('t2',this)">🟢 T2</button>
  <button class="tab t3" onclick="showTab('t3',this)">🟡 T3</button>
  <button class="tab tab-resumo" onclick="showTab('resumo',this)" style="margin-left:auto">📋 Resumo</button>
</div>

<div class="content">
  <div id="panel-t1" class="panel active"></div>
  <div id="panel-t2" class="panel"></div>
  <div id="panel-t3" class="panel"></div>
  <div id="panel-resumo" class="panel">
    <div class="resumo-grid" id="resumo-content"></div>
  </div>
</div>

<footer>MercadoLivre · INP/PS · <span id="footer-date"></span></footer>

<script>
var store = { t1: {}, t2: {}, t3: {} };

function getNomes(t){
  try{ return JSON.parse(localStorage.getItem('presenca_nomes_'+t)||'[]'); }catch(e){ return []; }
}
function saveNomes(t, arr){
  localStorage.setItem('presenca_nomes_'+t, JSON.stringify(arr));
}
function getStatus(t, nome){
  if(!store[t].presenca) store[t].presenca={};
  return store[t].presenca[nome]||'presente';
}
function setStatus(t, nome, val){
  if(!store[t].presenca) store[t].presenca={};
  store[t].presenca[nome]=val;
  var sel=document.getElementById('psel_'+t+'_'+safeId(nome));
  if(sel){ sel.className='presenca-select '+val; }
  updateHCFromPresenca(t);
}
function updateHCFromPresenca(t){
  var nomes = getNomes(t);
  var inp = nomes.filter(function(n){ return n.toUpperCase().indexOf(' INP')!==-1; });
  var ps  = nomes.filter(function(n){ return n.toUpperCase().indexOf(' INP')===-1; });
  function count(lista, status){
    return lista.filter(function(n){ return getStatus(t,n)===status; }).length;
  }
  var inpP=count(inp,'presente'), inpFer=count(inp,'ferias');
  var inpLic=count(inp,'licenca')+count(inp,'atestado'), inpFal=count(inp,'falta');
  var psP=count(ps,'presente'), psAt=count(ps,'atestado');
  var psFal=count(ps,'falta'), psLic=count(ps,'licenca')+count(ps,'ferias');
  store[t].hc_inp_p=inpP||''; store[t].hc_inp_fer=inpFer||'';
  store[t].hc_inp_lic=inpLic||''; store[t].hc_inp_f=inpFal||'';
  store[t].hc_ps_p=psP||''; store[t].hc_ps_at=psAt||'';
  store[t].hc_ps_fal=psFal||''; store[t].hc_ps_lic=psLic||'';
  function si(id,v){ var el=document.getElementById(id); if(el) el.value=v||''; }
  si('hc_'+t+'_inp_p',inpP); si('hc_'+t+'_inp_fer',inpFer);
  si('hc_'+t+'_inp_lic',inpLic); si('hc_'+t+'_inp_f',inpFal);
  si('hc_'+t+'_ps_p',psP); si('hc_'+t+'_ps_at',psAt);
  si('hc_'+t+'_ps_fal',psFal); si('hc_'+t+'_ps_lic',psLic);
}
function addPessoa(t){
  var inp=document.getElementById('inp_add_'+t);
  var nome=inp.value.trim();
  if(!nome) return;
  var arr=getNomes(t);
  if(arr.indexOf(nome)===-1){ arr.push(nome); saveNomes(t,arr); }
  inp.value=''; reRenderPresenca(t);
}
function removePessoa(t, nome){
  saveNomes(t, getNomes(t).filter(function(n){return n!==nome;}));
  reRenderPresenca(t);
}
function reRenderPresenca(t){
  var box=document.getElementById('presenca_box_'+t);
  if(box) box.outerHTML=buildPresenca(t);
  updateHCFromPresenca(t);
}
function safeId(nome){ return btoa(unescape(encodeURIComponent(nome))).replace(/[^a-zA-Z0-9]/g,''); }

function buildPresenca(t){
  var nomes=getNomes(t);
  var presentes=nomes.filter(function(n){return getStatus(t,n)==='presente';}).length;
  var rows=nomes.map(function(nome){
    var st=getStatus(t,nome), sid=safeId(nome);
    return '<tr>'
      +'<td class="presenca-nome">'+nome+'</td>'
      +'<td><select id="psel_'+t+'_'+sid+'" class="presenca-select '+st+'" onchange="setStatus(\''+t+'\',\''+nome.replace(/'/g,"\\'")+'\ ',this.value)">'
      +'<option value="presente"'+(st==='presente'?' selected':'')+'>✅ Presente</option>'
      +'<option value="falta"'+(st==='falta'?' selected':'')+'>❌ Falta</option>'
      +'<option value="atestado"'+(st==='atestado'?' selected':'')+'>🏥 Atestado</option>'
      +'<option value="ferias"'+(st==='ferias'?' selected':'')+'>🌴 Férias</option>'
      +'<option value="licenca"'+(st==='licenca'?' selected':'')+'>📋 Licença</option>'
      +'</select></td>'
      +'<td><button class="btn-rm" onclick="removePessoa(\''+t+'\',\''+nome.replace(/'/g,"\\'")+'\')" title="Remover">✕</button></td>'
      +'</tr>';
  }).join('');
  return '<div class="presenca-box" id="presenca_box_'+t+'">'
    +'<h4>👤 Lista de Presença <span class="presenca-count">'+presentes+'/'+nomes.length+' presentes</span></h4>'
    +(nomes.length
      ? '<table class="presenca-table"><thead><tr><th>Colaborador</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
      : '<div style="font-size:11px;color:#ccc;font-style:italic;padding:6px 0">Nenhum colaborador cadastrado ainda.</div>')
    +'<div class="presenca-add-row"><input type="text" id="inp_add_'+t+'" placeholder="Nome do colaborador..." onkeydown="if(event.key===\'Enter\')addPessoa(\''+t+'\')"><button class="btn-add-pessoa" onclick="addPessoa(\''+t+'\')">+ Adicionar</button></div>'
    +'</div>';
}

function sv(t,k,val){ store[t][k]=val; flash(t); }
function flash(t){ var el=document.getElementById('ss-'+t); if(el){el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2000);} }
function g(t,k){ return store[t][k]||''; }

function hcf(t,k,lbl){
  var domId='hc_'+t+'_'+k.replace('hc_inp_','inp_').replace('hc_ps_','ps_');
  return '<div class="hc-field"><label>'+lbl+'</label><input id="'+domId+'" type="number" value="'+g(t,k)+'" placeholder="0" onchange="sv(\''+t+'\',\''+k+'\',this.value)"></div>';
}
function met(t,k,lbl,color){
  return '<div class="metric '+color+'"><label>'+lbl+'</label><input type="text" value="'+g(t,k)+'" placeholder="—" onchange="sv(\''+t+'\',\''+k+'\',this.value)"></div>';
}

function buildForm(t){
  var ok=g(t,'cinco_s')==='OK'?'selected':'';
  var pend=g(t,'cinco_s')==='Pendente'?'selected':'';
  var nok=g(t,'cinco_s')==='NOK'?'selected':'';
  return ''
    +'<div class="top-row">'
      +'<div class="meta-box">'
        +'<label>Data</label><input type="date" value="'+g(t,'data')+'" onchange="sv(\''+t+'\',\'data\',this.value)">'
        +'<label style="margin-top:4px">Turno</label>'
        +'<select onchange="sv(\''+t+'\',\'turno\',this.value)">'
          +'<option '+(t==='t1'?'selected':'')+'>T1</option>'
          +'<option '+(t==='t2'?'selected':'')+'>T2</option>'
          +'<option '+(t==='t3'?'selected':'')+'>T3</option>'
        +'</select>'
      +'</div>'
      +'<div class="hc-box"><h4>👥 HC INP</h4><div class="hc-inline">'
        +hcf(t,'hc_inp_p','Pres.')+hcf(t,'hc_inp_f','Folgas')+hcf(t,'hc_inp_fer','Férias')+hcf(t,'hc_inp_sin','Sinergia')+hcf(t,'hc_inp_lic','Licença')
      +'</div></div>'
      +'<div class="hc-box"><h4>👥 HC PS Produção</h4><div class="hc-inline">'
        +hcf(t,'hc_ps_p','Pres.')+hcf(t,'hc_ps_tr','Trein.')+hcf(t,'hc_ps_at','Atest.')+hcf(t,'hc_ps_fal','Falta')+hcf(t,'hc_ps_lic','Licença')
      +'</div></div>'
    +'</div>'
    +'<div class="metrics-grid">'
      +met(t,'tarefas_real','Tarefas Realizadas','green')
      +met(t,'ci_backlog','Backlog','gray')
      +met(t,'ci_pecas','Peças Process.','green')
      +met(t,'ci_ps_fin','PS Finalizadas','green')
      +met(t,'tarefa6h','Tarefas < 6h','amber')
      +met(t,'ps_pend_ini','PS Pend. Início','red')
      +met(t,'ps_ident','PS Identificados','blue')
      +met(t,'ps_pend_fim','PS Pend. Fim','amber')
      +met(t,'pa_real','Put Away Real.','green')
      +met(t,'pa_pend','Put Away Pend.','amber')
      +met(t,'paletes','Paletes p/Linha','purple')
    +'</div>'
    +'<div class="bottom-row">'
      +'<div class="bottom-box"><h4>⚠️ Alertas / Tickets</h4>'
        +'<textarea class="alert-input" placeholder="Ex: SSHP-1234 — descrição..." onchange="sv(\''+t+'\',\'alertas\',this.value)">'+g(t,'alertas')+'</textarea>'
      +'</div>'
      +'<div class="bottom-box"><h4>📋 Outros</h4>'
        +'<div class="bottom-field"><label>Última ida na linha</label><input type="time" value="'+g(t,'ultima_ida')+'" onchange="sv(\''+t+'\',\'ultima_ida\',this.value)"></div>'
        +'<div class="bottom-field"><label>Reaberturas Pend.</label><input type="number" value="'+g(t,'reaberturas')+'" placeholder="0" onchange="sv(\''+t+'\',\'reaberturas\',this.value)"></div>'
        +'<div class="bottom-field"><label>5S</label>'
          +'<select onchange="sv(\''+t+'\',\'cinco_s\',this.value)">'
            +'<option value="">—</option>'
            +'<option value="OK" '+ok+'>✅ OK</option>'
            +'<option value="Pendente" '+pend+'>⏳ Pendente</option>'
            +'<option value="NOK" '+nok+'>❌ NOK</option>'
          +'</select>'
        +'</div>'
      +'</div>'
      +'<div class="bottom-box"><h4>📝 Observações</h4>'
        +'<textarea style="width:100%;resize:none;min-height:72px;border:1px solid #e0e0e0;border-radius:5px;padding:5px 7px;font-size:11px;font-family:inherit;outline:none;background:white" placeholder="Pontos de atenção para o próximo turno..." onchange="sv(\''+t+'\',\'obs\',this.value)">'+g(t,'obs')+'</textarea>'
      +'</div>'
    +'</div>'
    +buildPresenca(t)
    +'<div class="save-row"><span class="save-status" id="ss-'+t+'">✅ Salvo</span><button class="btn-clear" onclick="clearT(\''+t+'\')">Limpar</button></div>';
}

function clearT(t){ if(!confirm('Limpar dados do turno?'))return; store[t]={}; document.getElementById('panel-'+t).innerHTML=buildForm(t); updateHCFromPresenca(t); }

function showTab(name,btn){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='resumo') renderResumo();
}

function renderResumo(){
  var tl={t1:'T1',t2:'T2',t3:'T3'};
  document.getElementById('resumo-content').innerHTML=['t1','t2','t3'].map(function(t){
    var d=store[t], has=d.data||d.hc_ps_p;
    var rows=[
      ['Data', d.data?d.data.split('-').reverse().join('/'):'—'],
      ['HC INP', d.hc_inp_p||'—'],
      ['HC PS', d.hc_ps_p||'—'],
      ['Tarefas Realizadas', d.tarefas_real||'—'],
      ['Backlog', d.ci_backlog||'—'],
      ['PS Pend. Início', d.ps_pend_ini||'—'],
      ['PS Identificados', d.ps_ident||'—'],
      ['PS Pend. Fim', d.ps_pend_fim||'—'],
      ['5S', d.cinco_s||'—'],
      ['Alertas', d.alertas?d.alertas.substring(0,35)+(d.alertas.length>35?'…':''):'—']
    ];
    return '<div class="resumo-card '+t+'">'
      +'<span class="resumo-turno">Turno '+tl[t]+'</span>'
      +(has
        ? rows.map(function(r){return '<div class="resumo-row"><span class="rk">'+r[0]+'</span><span class="rv">'+r[1]+'</span></div>';}).join('')
        : '<div class="resumo-empty">Sem dados</div>')
      +'</div>';
  }).join('');
}

(function(){
  var nomesT2 = [
    "Agatha Christie Gomes Ferreira",
    "Alessandra Rosa de Almeida",
    "Allane Dorea Souza Nunes",
    "Bruno Oliveira Santos Silva",
    "Emanuela Santos da Silva",
    "Valdineia Teles da Costa",
    "Samila Dos Santos Albuquerque",
    "Isonice Wilma da Silva INP",
    "Janaina Souza Santana INP",
    "Karine Silva Do Nascimento",
    "Luana dos Santos Silva",
    "Pamela Cristina Prado dos Santos INP",
    "Paulo Henrique Lacerda",
    "Raul Paixao Meira",
    "Vitoria de Souza Figueiredo",
    "Raquel Borsoli de Brito Clementino",
    "Edna Maria Da Silva Santos",
    "Sheila Carvalho Dos Santos",
    "Daniel Lima Rodrigues"
  ];
  if(getNomes('t2').length === 0){ saveNomes('t2', nomesT2); }
})();

['t1','t2','t3'].forEach(function(t){
  document.getElementById('panel-'+t).innerHTML=buildForm(t);
  updateHCFromPresenca(t);
});
var now=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
document.getElementById('header-date').textContent=now;
document.getElementById('footer-date').textContent=now;
</script>
</body>
</html>
