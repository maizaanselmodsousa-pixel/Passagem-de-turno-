<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passagem de Turno — INP/PS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f1f3; color: #1a1a2e; font-size: 12px; }

/* HEADER */
header {
  background: linear-gradient(90deg, #ffe600, #ffcc00);
  padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 1px 4px rgba(0,0,0,0.12);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo { font-size: 18px; font-weight: 900; }
header h1 { font-size: 14px; font-weight: 800; }
header small { font-size: 10px; color: #666; }
.btn-sheets {
  background: #1a1a2e; color: white; border: none; border-radius: 6px;
  padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer;
  text-decoration: none; display: inline-block;
}

/* TABS */
.tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
.tab {
  padding: 5px 16px; border-radius: 7px 7px 0 0; font-size: 11px; font-weight: 700;
  border: 1.5px solid #ddd; border-bottom: none; background: #e8e9eb; cursor: pointer; color: #888;
}
.tab.active { background: white; color: #1a1a2e; border-color: #ccc; }
.tab.t1.active { background: #3b82f6; color: white; border-color: #3b82f6; }
.tab.t2.active { background: #10b981; color: white; border-color: #10b981; }
.tab.t3.active { background: #f59e0b; color: white; border-color: #f59e0b; }
.tab-resumo.active { background: #1a1a2e; color: #ffe600; border-color: #1a1a2e; }

/* CONTENT */
.content { background: white; margin: 0 12px 12px; border-radius: 0 8px 8px 8px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.panel { display: none; }
.panel.active { display: block; }

/* TOP ROW: data + HC side by side */
.top-row { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px; margin-bottom: 10px; align-items: start; }

.meta-box { display: flex; flex-direction: column; gap: 5px; }
.meta-box label { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; }
.meta-box input[type=date], .meta-box select {
  border: 1.5px solid #e0e0e0; border-radius: 6px; padding: 4px 8px;
  font-size: 11px; font-family: inherit; outline: none; background: #fafafa;
}
.meta-box input[type=date]:focus, .meta-box select:focus { border-color: #ffe600; }

.hc-box { background: #f8f9fa; border-radius: 8px; padding: 8px 10px; }
.hc-box h4 { font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; margin-bottom: 6px; }
.hc-inline { display: flex; flex-wrap: wrap; gap: 6px; }
.hc-field { display: flex; flex-direction: column; gap: 2px; min-width: 52px; }
.hc-field label { font-size: 9px; color: #aaa; font-weight: 700; text-transform: uppercase; }
.hc-field input {
  border: 1px solid #e0e0e0; border-radius: 5px; padding: 3px 5px;
  font-size: 12px; font-weight: 700; font-family: inherit; outline: none;
  background: white; width: 52px; text-align: center;
}
.hc-field input:focus { border-color: #3b82f6; }

/* METRICS GRID */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}
.metric {
  background: #f8f9fa; border-radius: 7px; padding: 7px 8px;
  border-left: 3px solid #e0e0e0;
  display: flex; flex-direction: column; gap: 2px;
}
.metric.blue  { border-left-color: #3b82f6; }
.metric.green { border-left-color: #10b981; }
.metric.amber { border-left-color: #f59e0b; }
.metric.red   { border-left-color: #ef4444; }
.metric.purple{ border-left-color: #8b5cf6; }
.metric.gray  { border-left-color: #9ca3af; }
.metric label { font-size: 9px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.3px; }
.metric input {
  font-size: 20px; font-weight: 900; color: #1a1a2e;
  border: none; outline: none; background: transparent;
  font-family: inherit; width: 100%; padding: 0;
}
.metric input:focus { color: #3b82f6; }

/* BOTTOM ROW */
.bottom-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.bottom-box { background: #f8f9fa; border-radius: 7px; padding: 8px 10px; }
.bottom-box h4 { font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; margin-bottom: 6px; }
.bottom-field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
.bottom-field label { font-size: 9px; font-weight: 700; color: #aaa; text-transform: uppercase; }
.bottom-field input, .bottom-field select, .bottom-field textarea {
  border: 1px solid #e0e0e0; border-radius: 5px; padding: 4px 6px;
  font-size: 11px; font-family: inherit; outline: none; background: white;
}
.bottom-field input:focus, .bottom-field select:focus, .bottom-field textarea:focus { border-color: #ffe600; }
.bottom-field textarea { resize: none; min-height: 44px; font-size: 11px; }

.alert-input {
  width: 100%; border: 1px solid #fed7aa; border-radius: 5px;
  padding: 5px 7px; font-size: 11px; font-family: inherit; outline: none;
  background: #fff7ed; color: #92400e; font-weight: 600; resize: none; min-height: 40px;
}
.alert-input:focus { border-color: #f59e0b; }

/* save bar */
.save-row {
  display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 8px;
}
.save-status { font-size: 11px; color: #10b981; font-weight: 700; opacity: 0; transition: opacity 0.3s; }
.save-status.show { opacity: 1; }
.btn-clear { background: #f0f0f0; color: #666; border: none; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
.btn-open { background: #1a1a2e; color: white; border: none; border-radius: 6px; padding: 5px 14px; font-size: 11px; font-weight: 700; cursor: pointer; text-decoration: none; }

/* RESUMO */
.resumo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.resumo-card { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; }
.resumo-turno { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
.t1 .resumo-turno { background: #dbeafe; color: #1e40af; }
.t2 .resumo-turno { background: #d1fae5; color: #065f46; }
.t3 .resumo-turno { background: #fef3c7; color: #92400e; }
.resumo-row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #ececec; }
.resumo-row:last-child { border: none; }
.rk { color: #999; }
.rv { font-weight: 700; }
.resumo-empty { font-size: 11px; color: #ccc; font-style: italic; text-align: center; padding: 20px 0; }

footer { text-align: center; padding: 8px; font-size: 10px; color: #ccc; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="logo">ML</span>
    <div>
      <h1>Passagem de Turno — INP / PS</h1>
      <small id="header-date"></small>
    </div>
  </div>
  <a class="btn-sheets" href="https://docs.google.com/spreadsheets/d/1F09r4otAryw8CQ-sjIbaD0y6cG4Xu__vtKRIuxjBiJc/edit" target="_blank">📊 Planilha</a>
</header>

<div class="tabs">
  <button class="tab t1 active" onclick="showTab('t1',this)">🔵 T1</button>
  <button class="tab t2" onclick="showTab('t2',this)">🟢 T2</button>
  <button class="tab t3" onclick="showTab('t3',this)">🟡 T3</button>
  <button class="tab tab-resumo" onclick="showTab('resumo',this)" style="margin-left:auto">📋 Resumo</button>
</div>

<div class="content">
  <div id="panel-t1" class="panel active"></div>
  <div id="panel-t2" class="panel"></div>
  <div id="panel-t3" class="panel"></div>
  <div id="panel-resumo" class="panel">
    <div class="resumo-grid" id="resumo-content"></div>
  </div>
</div>

<footer>MercadoLivre · INP/PS · <span id="footer-date"></span></footer>

<script>
const store = {
  t1: {},
  t2: {
    data:'2026-06-02',
    hc_inp_p:'3', hc_inp_f:'0', hc_inp_fer:'0', hc_inp_sin:'0', hc_inp_lic:'0',
    hc_ps_p:'9', hc_ps_tr:'3', hc_ps_at:'0', hc_ps_fal:'0', hc_ps_lic:'0',
    ci_inicio:'29', ci_backlog:'0', ci_fim:'0', ci_pecas:'0', ci_ps_fin:'0',
    tarefa6h:'0',
    ps_pend_ini:'5', ps_ident:'7', ps_pend_fim:'0',
    pa_real:'0', pa_pend:'0', paletes:'0',
    ultima_ida:'22:00',
    alertas:'SSHP-1472977 — Lost de Lista de Totes Aprovado',
    reaberturas:'0', cinco_s:'OK', obs:''
  },
  t3: {}
};

function sv(t,k,v){ store[t][k]=v; flash(t); }
function flash(t){
  const el=document.getElementById('ss-'+t);
  if(el){el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000);}
}
function v(t,k){ return store[t][k]||''; }

function inp(t,k,type,placeholder,cls){
  const val = v(t,k);
  if(type==='textarea') return `<textarea class="${cls||''}" placeholder="${placeholder}" onchange="sv('${t}','${k}',this.value)">${val}</textarea>`;
  return `<input type="${type}" value="${val}" placeholder="${placeholder||''}" onchange="sv('${t}','${k}',this.value)">`;
}

function buildForm(t){
  return `
  <div class="top-row">
    <div class="meta-box">
      <label>Data</label>
      <input type="date" value="${v(t,'data')}" onchange="sv('${t}','data',this.value)">
      <label style="margin-top:4px">Turno</label>
      <select onchange="sv('${t}','turno',this.value)">
        <option ${t==='t1'?'selected':''}>T1</option>
        <option ${t==='t2'?'selected':''}>T2</option>
        <option ${t==='t3'?'selected':''}>T3</option>
      </select>
    </div>
    <div class="hc-box">
      <h4>👥 HC INP</h4>
      <div class="hc-inline">
        ${hcf(t,'hc_inp_p','Pres.')}
        ${hcf(t,'hc_inp_f','Folgas')}
        ${hcf(t,'hc_inp_fer','Férias')}
        ${hcf(t,'hc_inp_sin','Sinergia')}
        ${hcf(t,'hc_inp_lic','Licença')}
      </div>
    </div>
    <div class="hc-box">
      <h4>👥 HC PS Produção</h4>
      <div class="hc-inline">
        ${hcf(t,'hc_ps_p','Pres.')}
        ${hcf(t,'hc_ps_tr','Trein.')}
        ${hcf(t,'hc_ps_at','Atest.')}
        ${hcf(t,'hc_ps_fal','Falta')}
        ${hcf(t,'hc_ps_lic','Licença')}
      </div>
    </div>
  </div>

  <div class="metrics-grid">
    ${met(t,'ci_inicio','Check-in Início','blue')}
    ${met(t,'ci_backlog','Backlog','gray')}
    ${met(t,'ci_fim','Check-in Fim','blue')}
    ${met(t,'ci_pecas','Peças Process.','green')}
    ${met(t,'ci_ps_fin','PS Finalizadas','green')}
    ${met(t,'tarefa6h','Tarefas < 6h','amber')}
    ${met(t,'ps_pend_ini','PS Pend. Início','red')}
    ${met(t,'ps_ident','PS Identificados','blue')}
    ${met(t,'ps_pend_fim','PS Pend. Fim','amber')}
    ${met(t,'pa_real','Put Away Real.','green')}
    ${met(t,'pa_pend','Put Away Pend.','amber')}
    ${met(t,'paletes','Paletes p/Linha','purple')}
  </div>

  <div class="bottom-row">
    <div class="bottom-box">
      <h4>⚠️ Alertas / Tickets</h4>
      <textarea class="alert-input" placeholder="Ex: SSHP-1234 — descrição..." onchange="sv('${t}','alertas',this.value)">${v(t,'alertas')}</textarea>
    </div>
    <div class="bottom-box">
      <h4>📋 Outros</h4>
      <div class="bottom-field"><label>Última ida na linha</label><input type="time" value="${v(t,'ultima_ida')}" onchange="sv('${t}','ultima_ida',this.value)"></div>
      <div class="bottom-field"><label>Reaberturas Pend.</label><input type="number" value="${v(t,'reaberturas')}" placeholder="0" onchange="sv('${t}','reaberturas',this.value)"></div>
      <div class="bottom-field"><label>5S</label>
        <select onchange="sv('${t}','cinco_s',this.value)">
          <option value="">—</option>
          <option value="OK" ${v(t,'cinco_s')==='OK'?'selected':''}>✅ OK</option>
          <option value="Pendente" ${v(t,'cinco_s')==='Pendente'?'selected':''}>⏳ Pendente</option>
          <option value="NOK" ${v(t,'cinco_s')==='NOK'?'selected':''}>❌ NOK</option>
        </select>
      </div>
    </div>
    <div class="bottom-box">
      <h4>📝 Observações</h4>
      <textarea style="width:100%;resize:none;min-height:72px;border:1px solid #e0e0e0;border-radius:5px;padding:5px 7px;font-size:11px;font-family:inherit;outline:none;background:white" placeholder="Pontos de atenção para o próximo turno..." onchange="sv('${t}','obs',this.value)">${v(t,'obs')}</textarea>
    </div>
  </div>

  <div class="save-row">
    <span class="save-status" id="ss-${t}">✅ Salvo</span>
    <button class="btn-clear" onclick="clearT('${t}')">Limpar</button>
    <a class="btn-open" href="https://docs.google.com/spreadsheets/d/1F09r4otAryw8CQ-sjIbaD0y6cG4Xu__vtKRIuxjBiJc/edit" target="_blank">📊 Abrir Planilha</a>
  </div>
  `;
}

function hcf(t,k,lbl){
  return `<div class="hc-field"><label>${lbl}</label><input type="number" value="${v(t,k)}" placeholder="0" onchange="sv('${t}','${k}',this.value)"></div>`;
}

function met(t,k,lbl,color){
  return `<div class="metric ${color}"><label>${lbl}</label><input type="text" value="${v(t,k)}" placeholder="—" onchange="sv('${t}','${k}',this.value)"></div>`;
}

function clearT(t){
  if(!confirm('Limpar dados?')) return;
  store[t]={};
  document.getElementById('panel-'+t).innerHTML = buildForm(t);
}

function showTab(name,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+name).classList.add('active');
  if(name==='resumo') renderResumo();
}

function renderResumo(){
  const tl={t1:'T1',t2:'T2',t3:'T3'};
  document.getElementById('resumo-content').innerHTML = ['t1','t2','t3'].map(t=>{
    const d=store[t];
    const has=d.data||d.hc_ps_p;
    const rows=[
      ['Data', d.data ? d.data.split('-').reverse().join('/') : '—'],
      ['HC INP', d.hc_inp_p||'—'],
      ['HC PS', d.hc_ps_p||'—'],
      ['Check-in Início', d.ci_inicio||'—'],
      ['Check-in Fim', d.ci_fim||'—'],
      ['PS Pend. Início', d.ps_pend_ini||'—'],
      ['PS Identificados', d.ps_ident||'—'],
      ['PS Pend. Fim', d.ps_pend_fim||'—'],
      ['5S', d.cinco_s||'—'],
      ['Alertas', d.alertas ? d.alertas.substring(0,35)+(d.alertas.length>35?'…':'') : '—'],
    ];
    return `<div class="resumo-card ${t}">
      <span class="resumo-turno">Turno ${tl[t]}</span>
      ${has ? rows.map(([k,v])=>`<div class="resumo-row"><span class="rk">${k}</span><span class="rv">${v}</span></div>`).join('') : '<div class="resumo-empty">Sem dados</div>'}
    </div>`;
  }).join('');
}

// Init
['t1','t2','t3'].forEach(t=>{ document.getElementById('panel-'+t).innerHTML=buildForm(t); });
const now=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
document.getElementById('header-date').textContent=now;
document.getElementById('footer-date').textContent=now;
</script>
</body>
</html>
